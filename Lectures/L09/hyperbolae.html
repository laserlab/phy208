<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperbola Sheet — PHY 208</title>
<style>
  :root{ --ink:#1c1c1c; --grid:#d8d8d8; --curve:#8a8a8a; --hi:#b03030; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#fff;color:var(--ink);
       font:15px/1.45 "Helvetica Neue",-apple-system,BlinkMacSystemFont,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{padding:9px 16px;border-bottom:1px solid #e6e6e6;border-top:4px solid #005bbb;
         flex:none;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  h1{margin:0;font-size:16px;font-weight:600}
  header p{margin:0;color:#666;font-size:12.5px}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
  svg{width:auto;height:100%;max-width:100%}
  /* Full-bleed mode: the whole point is to lay paper on the screen, so the
     chrome has to be able to disappear. */
  body.bare header{display:none}
  body.bare .stage{padding:0}
  #btn{position:fixed;right:12px;top:9px;z-index:9;background:#f2f2f2;
       border:1px solid #ccc;border-radius:6px;padding:4px 10px;font-size:12.5px;
       cursor:pointer;opacity:.75}
  #btn:hover{opacity:1}
  body.bare #btn{opacity:.25}
  body.bare #btn:hover{opacity:1}
  @media print{ header,#btn{display:none} .stage{padding:0} }
</style>
</head>
<body>
<header>
  <h1>Hyperbola sheet</h1>
  <p>Curves of constant interval, every 0.5. <strong>Put your map sheet on the
     screen</strong> and slide it so the vertex sits on the event you are
     measuring from. Red is 3.161.</p>
</header>
<div class="stage"><svg id="s" viewBox="0 0 640 700" role="img"
     aria-label="Family of hyperbolae of constant spacetime interval above a light cone."></svg></div>
<button id="btn">Hide text (F)</button>
<script>
(function(){
  var XM = 5, TM = 10.5, W = 640, H = 700, P = 26;
  var sx = (W - 2*P)/(2*XM), sy = (H - 2*P)/TM;
  var X = function(x){ return P + (x + XM)*sx; };
  var Y = function(t){ return H - P - t*sy; };
  var out = [];
  function line(x1,y1,x2,y2,c,w,d){
    out.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+
      '" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>');
  }
  // square grid
  for(var x=-XM; x<=XM+1e-9; x+=0.5) line(X(x),Y(0),X(x),Y(TM),'var(--grid)',0.6);
  for(var t=0; t<=TM+1e-9; t+=0.5)  line(X(-XM),Y(t),X(XM),Y(t),'var(--grid)',0.6);
  // hyperbolae ct^2 - x^2 = tau^2
  function curve(tau,c,w){
    var p=[], n=140;
    for(var i=0;i<=n;i++){
      var xx = -XM + 2*XM*i/n;
      p.push((i?'L':'M')+X(xx).toFixed(1)+' '+Y(Math.sqrt(tau*tau+xx*xx)).toFixed(1));
    }
    out.push('<path d="'+p.join(' ')+'" fill="none" stroke="'+c+'" stroke-width="'+w+'"/>');
  }
  for(var tau=0.5; tau<=10.001; tau+=0.5){
    var whole = Math.abs(tau-Math.round(tau))<1e-9;
    curve(tau,'var(--curve)',whole?1.15:0.6);
    if(whole) out.push('<text x="'+(X(0)+4)+'" y="'+(Y(tau)-3)+
      '" font-size="10" fill="var(--curve)">'+tau+'</text>');
  }
  curve(3.161,'var(--hi)',1.4);
  out.push('<text x="'+X(-1.9)+'" y="'+(Y(Math.sqrt(3.161*3.161+1.9*1.9))-4)+
           '" font-size="10.5" fill="var(--hi)">3.161</text>');
  // light cone and axes, drawn last so they sit on top
  line(X(0),Y(0),X(XM),Y(XM),'var(--ink)',1.1,'5 4');
  line(X(0),Y(0),X(-XM),Y(XM),'var(--ink)',1.1,'5 4');
  line(X(-XM),Y(0),X(XM),Y(0),'var(--ink)',1.3);
  line(X(0),Y(0),X(0),Y(TM),'var(--ink)',1.3);
  for(var k=-5;k<=5;k++) if(k) out.push('<text x="'+X(k)+'" y="'+(Y(0)+14)+
    '" font-size="10" fill="#555" text-anchor="middle">'+k+'</text>');
  document.getElementById('s').innerHTML = out.join('');
  var b = document.getElementById('btn');
  function toggle(){ document.body.classList.toggle('bare');
    b.textContent = document.body.classList.contains('bare') ? 'Show text (F)' : 'Hide text (F)'; }
  b.onclick = toggle;
  addEventListener('keydown', function(e){ if((e.key||'').toLowerCase()==='f') toggle(); });
})();
</script>
</body>
</html>
